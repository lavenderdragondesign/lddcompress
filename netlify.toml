[build]
  # package-lock.json is not committed in this repo, so we can't use `npm ci`.
  # Use a stable Node version + a deterministic-ish install.
  command = "npm install --no-audit --no-fund --legacy-peer-deps && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
  # Speeds up installs a bit and avoids some legacy peer resolution stalls
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
